<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>傑生工程工作室</title>
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#shop">
        <span class="brand-mark">J</span>
        <span>
          <strong>傑生工程工作室</strong>
          <small>工作室選品與訂單管理</small>
        </span>
      </a>
      <nav>
        <button data-view="shop">商店</button>
        <button data-view="orders" class="auth-only">訂單記錄</button>
        <button data-view="admin" class="admin-only">後台管理</button>
      </nav>
      <div class="account">
        <span id="userBadge"></span>
        <button id="logoutBtn" class="auth-only ghost">登出</button>
        <button data-view="auth" class="guest-only">登入 / 註冊</button>
      </div>
    </header>

    <main>
      <section id="notice" class="notice hidden"></section>

      <section id="shopView" class="view active">
        <div class="hero">
          <div class="hero-copy">
            <p class="eyebrow">嵌入式系統工作室</p>
            <h1>專注嵌入式系統開發，打造穩定可靠的智慧應用。</h1>
            <p>我們整合韌體設計、硬體控制、感測資料與通訊介面，協助專案從原型驗證到實際部署，讓每個系統都更貼近現場需求。</p>
          </div>
          <div class="hero-panel">
            <span>會員狀態</span>
            <strong id="heroStatus">登入後可下單</strong>
            <small>登入並通過審核後，就可以開始下單與查看訂單。</small>
            <div class="visitor-count">
              <span>瀏覽人數</span>
              <strong id="visitorCount">0</strong>
            </div>
          </div>
        </div>

        <div class="section-title">
          <div>
            <p class="eyebrow">商品</p>
            <h2>最新上架</h2>
          </div>
          <button id="openCartBtn" class="primary">購物車 <span id="cartCount">0</span></button>
        </div>
        <div id="productsGrid" class="product-grid"></div>
      </section>

      <section id="authView" class="view">
        <div class="auth-grid">
          <form id="loginForm" class="panel">
            <p class="eyebrow">會員 / 管理員</p>
            <h2>登入</h2>
            <label>帳號或 Email<input name="username" autocomplete="username" required></label>
            <label>密碼<input name="password" type="password" autocomplete="current-password" required></label>
            <button class="primary">登入</button>
          </form>
          <form id="registerForm" class="panel">
            <p class="eyebrow">會員註冊</p>
            <h2>註冊帳號</h2>
            <label>帳號<input name="username" minlength="3" required></label>
            <label>Email<input name="email" type="email" required></label>
            <label>密碼<input name="password" type="password" minlength="6" required></label>
            <button class="primary">送出申請</button>
            <p class="hint">註冊後需通過審核，才能登入並開始下單。</p>
          </form>
        </div>
      </section>

      <section id="ordersView" class="view">
        <div class="section-title">
          <div>
            <p class="eyebrow">訂單</p>
            <h2>訂單記錄</h2>
            <p class="hint">登入後可以查看自己的訂單狀態與金額。</p>
          </div>
        </div>
        <div id="ordersList" class="stack"></div>
      </section>

      <section id="adminView" class="view">
        <div class="section-title">
          <div>
            <p class="eyebrow">後台管理</p>
            <h2>管理總覽</h2>
          </div>
        </div>
        <div class="admin-layout">
          <div class="stack">
            <div class="panel">
              <p class="eyebrow">會員</p>
              <h2>會員審核</h2>
              <div id="usersTable" class="table"></div>
            </div>
            <div class="panel">
              <p class="eyebrow">訂單</p>
              <h2>訂單管理</h2>
              <div id="adminOrders" class="table"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <aside id="cartDrawer" class="drawer" aria-hidden="true">
      <div class="drawer-panel">
        <div class="drawer-head">
          <h2>購物車</h2>
          <button id="closeCartBtn" class="ghost">關閉</button>
        </div>
        <div id="cartItems" class="stack"></div>
        <form id="checkoutForm">
          <label>收件人<input name="customer_name" required></label>
          <label>電話<input name="phone" required></label>
          <label>地址<input name="address" required></label>
          <label>備註<textarea name="note" rows="3"></textarea></label>
          <div class="total">總計 <strong id="cartTotal">NT$0</strong></div>
          <button class="primary">送出訂單</button>
        </form>
      </div>
    </aside>

    <script src="/static/app.js"></script>
  </body>
</html>
